<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Уран бичлэг тамга">
  <!--
    Дөрвөлжин тамга: улаан талбай дээр хар лабиринт хээ.

    Дотор нь эргэх хээ — зүүн ирмэгээс эхлээд цагийн зүүний дагуу дотогшоо
    мушгирна. Нэг л тасралтгүй зам: эхлэл, төгсгөл нь холбогдоогүй ч зам нь
    хаана ч тасрахгүй — үргэлжлэлийн бэлгэдэл.

    Зурлагын зузаан (5) ба эргэлт хоорондын зай (8) хоёрын харьцаа хээний
    нягтыг тодорхойлно. Зузааныг өсгөвөл улаан завсар хаагдаж, хээ нь хар
    дөрвөлжин болж хувирна.
  -->
  <rect width="96" height="96" fill="#100c08"/>
  <rect x="4" y="4" width="88" height="88" fill="#d42a1e"/>

  <g fill="none" stroke="#100c08" stroke-width="5" stroke-linecap="square">
    <rect x="12" y="12" width="72" height="72" stroke-width="4"/>
    <path d="M10 48H16V16H80V80H24V24H72V72H32V32H64V64H40V40H56V56H48"/>
  </g>
</svg>
