<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 147" width="165" height="147" role="img" aria-label="Монгол бичиг — тамганы лого">
  <!--
    Үндсэн лого: давхар хүрээтэй дөрвөлжин тамга, дотор нь монгол бичгийн
    зурлагыг тамганы бичиг (хас үсэг) маягаар өнцөглөсөн хэлбэр.

    Бүтэц нь гурван давхарга:
      1. Гадна бүдүүн хүрээ (хажуу тал 11, дээд/доод 10) — тамганы мод.
      2. Дотор нимгэн хүрээ (зузаан 1.6) — бичээсийн талбайг тусгаарлана.
      3. Зурлага (зузаан 6.5) — зүүн талын босоо нуруу, түүнээс баруун тийш
         сунасан ес хэвтээ зурлага, үзүүрүүд нь ээлжлэн зүүн/баруун талаараа
         холбогдож нэг тасралтгүй зам үүсгэнэ.

    Хоёр нимгэн (зузаан 4) богино зурвас нь 1 ба 4-р зурлагын толгой дээр
    сууна — монгол бичгийн «шүд». Тэднийг арилгавал үсгийн уншигдац алдагдана.

    Координат: SVG-ийн 1 нэгж = эх зургийн 1 цэг, гадна хүрээ нь viewBox-ын
    ирмэгт яг тулна. Хэмжээг зөвхөн CSS-ээр өөрчил — viewBox-д бүү гар.
  -->
  <!--
    Гадна хүрээ. Хажуу тал нь дээд/доод талаасаа зузаан (11 ба 10) тул нэг
    `rect`-ийн зурлагаар гаргаж болохгүй — дүүргэлттэй, нүхтэй замаар зурав.
  -->
  <path fill="#e52026" fill-rule="evenodd" d="M0 0h165v147H0z M11 10h143v127H11z"/>

  <g fill="none" stroke="#e52026">
    <!-- Дотор нимгэн хүрээ -->
    <rect x="19" y="17.5" width="126.5" height="113" stroke-width="1.6"/>

    <!-- Зурлага. Огтлолцол давхцаж болно — нэг өнгө тул ялгаа гарахгүй. -->
    <g stroke-width="6.5" stroke-linecap="butt">
      <!-- Хэвтээ зурлага, дээрээс доош -->
      <path d="M45 30H134.75"/>
      <path d="M42.5 41H134.75"/>
      <path d="M42.5 53H134.75"/>
      <path d="M45 66H134.75"/>
      <path d="M42.5 76H134.75"/>
      <path d="M42.5 87H134.75"/>
      <path d="M42.5 99H134.75"/>
      <path d="M55.5 110H134.75"/>
      <path d="M29.5 122H134.75"/>

      <!-- Зүүн нуруу: дээрээсээ доош уруудаад сүүлийн зурлага руу эргэнэ -->
      <path d="M29.5 23V122"/>

      <!-- Баруун талын холбоос -->
      <path d="M134.75 23V41"/>
      <path d="M134.75 53V76"/>
      <path d="M134.75 87V99"/>
      <path d="M134.75 110V122"/>

      <!-- Зүүн талын холбоос ба доод сэрээ -->
      <path d="M42.5 41V53"/>
      <path d="M42.5 76V87"/>
      <path d="M42.5 99V113"/>
      <path d="M55.5 99V110"/>
    </g>

    <!-- Шүд -->
    <g stroke-width="4" stroke-linecap="butt">
      <path d="M39 25H55"/>
      <path d="M39 61H55"/>
    </g>
  </g>
</svg>
