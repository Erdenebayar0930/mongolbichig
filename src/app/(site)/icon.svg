<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Уран бичлэг тамга">
  <!--
    Хөтчийн табны тэмдэг. public/brand/seal.svg-ийн ХЯЛБАРШУУЛСАН хувилбар.

    Эх тамга нь 5 эргэлттэй, зурлагын зузаан 5 — 16px дээр эргэлтүүд нийлж
    бүхэлдээ бараан улаан толбо болдог. Энд эргэлтийг 3 болгосон.

    ⚠ Координатууд ПИКСЕЛ ТОРОНД тааруулагдсан — санамсаргүй тоо биш:
      96 / 16px = 6 нэгж нь яг 1 пиксел.
      · зурлагын зузаан 6      → 16px дээр яг 1px, 32px дээр 2px
      · бүх координат 6k+3     → зурлага пикселийн ТӨВД тулна
      · улаан талбай 6..90     → захад яг 1px хар хүрээ үлдэнэ
    Эдгээрийг зөрчвөл (ж нь зузаан 7.5, координат 8/16/26) зурлага хоёр
    пикселийн завсарт унаж, хагас өнгөөр тархан, тамга бүрхэг болно.
    Хэмжээг өөрчлөх шаардлага гарвал 6-ийн үржвэрээр л алхана.

    Том хэмжээнд (PWA icon, apple-icon, хуваалцах карт) эх seal.svg бүтнээрээ
    ашиглагдана — тэднийг scripts/generate-brand-assets.mjs гаргана.
  -->
  <rect width="96" height="96" fill="#100c08"/>
  <rect x="6" y="6" width="84" height="84" fill="#d42a1e"/>
  <g fill="none" stroke="#100c08" stroke-width="6" stroke-linecap="square">
    <path d="M0 45H21V21H75V75H33V33H63V63H45"/>
  </g>
</svg>
